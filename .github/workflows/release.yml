name: Release download

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: verify · build · package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Configure git identity for tests
        run: |
          git config --global user.name "dsh-code-sidebar-ci"
          git config --global user.email "ci@dsh.invalid"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package download
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          cp release/dsh-better-sidebar-*.tgz release/dsh-code-sidebar.tgz
          cd release
          sha256sum dsh-code-sidebar.tgz > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/dsh-code-sidebar.tgz \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "DSH Code Sidebar $GITHUB_REF_NAME"

      - name: Upload workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: dsh-code-sidebar
          path: |
            release/dsh-code-sidebar.tgz
            release/SHA256SUMS.txt
